name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'   # Daily rebuild (after auto-sync at 00:00) so deadlines/counts stay fresh
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      # No DATABASE_URL here on purpose: builds must use the committed JSON.
      # The DB path only returns active rows (~28) and has null eligibility,
      # which shrinks the site and breaks quiz matching. Freshness comes from
      # auto-sync committing JSON + the daily rebuild cron.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=scholarab
