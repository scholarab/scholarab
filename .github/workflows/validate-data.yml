name: validate-data

on:
  pull_request:
    paths:
      - 'src/data/**'
  push:
    branches: [main]
    paths:
      - 'src/data/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate scholarship and program data
        run: node scripts/validate-data.js
