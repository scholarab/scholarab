name: Scholarship Link Checker

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run link checker
        id: checker
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/check-links.ts 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            REPORT=$(echo "$OUTPUT" | grep '^REPORT_JSON=' | sed 's/^REPORT_JSON=//')
            echo "report_json=$REPORT" >> "$GITHUB_OUTPUT"
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update link report issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const TITLE = 'Link checker report';
            const date = new Date().toISOString().slice(0, 10);
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-link',
              state: 'open',
            });
            const existing = open.find(i => i.title === TITLE);

            if (process.env.HAS_FINDINGS !== 'true') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All links passed on ${date}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const { broken, suspect } = JSON.parse(process.env.REPORT_JSON);
            const table = rows => [
              '| Name | URL | Error |',
              '|------|-----|-------|',
              ...rows.map(b => `| ${b.name} | ${b.url} | \`${b.error}\` |`),
            ].join('\n');
            const sections = [`Last run: ${date}`];
            if (broken.length) {
              sections.push(`## Broken (${broken.length}) — page is gone, listing needs a new URL\n\n${table(broken)}`);
            }
            if (suspect.length) {
              sections.push(`## Suspect (${suspect.length}) — request refused or flaky, verify in a browser before changing data\n\nIf a host is confirmed live but permanently blocks automated checks, add it to \`scripts/link-checker-ignore.json\`.\n\n${table(suspect)}`);
            }
            sections.push('_Auto-generated by the [Link Checker](.github/workflows/link-checker.yml) workflow. This issue is updated in place each run and closed when all links pass._');
            const body = sections.join('\n\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: ['broken-link'],
              });
            }
        env:
          HAS_FINDINGS: ${{ steps.checker.outputs.has_findings }}
          REPORT_JSON: ${{ steps.checker.outputs.report_json }}
