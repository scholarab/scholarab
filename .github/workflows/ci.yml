name: CI

# Deploys are done by Cloudflare Pages' git integration (it builds every push
# to main; wrangler.toml's pages_build_output_dir is its config). This workflow
# is validation + the daily data sync. The old wrangler-action deploy step was
# removed 2026-07-17: it had never once succeeded (0 green runs in 884) and CF
# was the real deploy path all along.
#
# The daily sync push below was rejected by the "main" ruleset's required
# "validate" status check for the repo's entire history (github-actions[bot]
# cannot be a ruleset bypass actor). Ilia removed the required check on
# 2026-07-17, so bot data pushes can land now — if sync commits ever stop
# appearing on data-change days, check the ruleset first.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # Daily: sync scholarship active flags; a data commit triggers the CF Pages deploy
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DATABASE_URL is scoped to this step only — the build below must never see it.
      - name: Sync scholarship active flags
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/auto-expire.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      # No DATABASE_URL here on purpose: builds must use the committed JSON.
      # The DB path only returns active rows (~28) and has null eligibility,
      # which shrinks the site and breaks quiz matching.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      # Last so a rejected push can't hide validation results. The commit tag
      # skips GitHub Actions only — Cloudflare Pages still sees the push and
      # deploys the fresh data. Do NOT tag it to skip "ci": Cloudflare honors
      # that form too and the deploy would be silently skipped.
      - name: Commit synced data
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add src/data/scholarships.json src/data/research-programs.json
          git diff --staged --quiet || { git commit -m "auto-sync scholarships [skip actions]" && git push; }

  # Playwright smoke tests against the built dist/, served the same way local
  # runs serve it (wrangler pages dev). This is a post-push signal, not a deploy
  # gate — Cloudflare Pages deploys in parallel and cannot wait on it — so a red
  # run here means "prod just shipped something the smoke tests don't like, go
  # look", not "the deploy was blocked". Skipped on the cron data-sync run,
  # where there's no code change to exercise.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both Playwright projects (Desktop Chrome + Pixel 7) run on the Chromium
      # engine, so only that browser is needed.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # No DATABASE_URL — same as the validate build. The E2E specs assert on the
      # committed-JSON site (listing counts, quiz flow), which the DB path breaks.
      - name: Build
        run: npm run build

      # playwright.config.ts starts `wrangler pages dev dist` itself and waits on
      # it; CI-mode retries/workers/forbidOnly are already gated on $CI there.
      - name: E2E
        run: npm run test:e2e
