name: CI

# Deploys are done by Cloudflare Pages' git integration (it builds every push
# to main; wrangler.toml's pages_build_output_dir is its config). This workflow
# is validation + the daily data sync. The old wrangler-action deploy step was
# removed 2026-07-17: it had never once succeeded (0 green runs in 884) and CF
# was the real deploy path all along.
#
# The daily sync push below was rejected by the "main" ruleset's required
# "validate" status check for the repo's entire history (github-actions[bot]
# cannot be a ruleset bypass actor). Ilia removed the required check on
# 2026-07-17, so bot data pushes can land now. If sync commits ever stop
# appearing on data-change days, check the ruleset first.

on:
  push:
    branches: [main]
  # The same checks before merge, so a PR is validated before Cloudflare deploys
  # it. The steps that write (data commit, DB mirror, IndexNow) skip PRs.
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # Daily: sync scholarship active flags; a data commit triggers the CF Pages deploy
  workflow_dispatch:

# One group per trigger, so the daily cron cannot cancel a push run. Until
# 2026-09-04 every trigger shared "ci-main" with cancel-in-progress, and any
# push still running at 00:00 UTC was cancelled by the schedule, which then
# showed as a red X on a commit that was fine. Pushes still supersede each
# other; scheduled and manual runs never cancel, since they can be part way
# through committing a data sync.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            public/og/scholarships
            .cache/og-images.json
          key: og-${{ runner.os }}-${{ hashFiles('scripts/generate-og-images.ts', 'scripts/opaque-png.ts', 'scripts/og-fonts/*', 'package-lock.json', 'src/data/scholarships.json') }}
          restore-keys: og-${{ runner.os }}-
      - run: npm ci

      # Expiration edits only the JSON working copy. It has no database access;
      # nothing is mirrored until the resulting snapshot passes every check and
      # any changed data is successfully pushed to main.
      - name: Sync scholarship active flags
        run: npx tsx scripts/auto-expire.ts

      # One definition for local and hosted verification. Build uses only JSON.
      - name: Validate snapshot
        run: npm run ci

      - name: Install Playwright Chromium
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium

      # Exercise the exact build validated above; no second install or rebuild.
      - name: Browser tests
        if: github.event_name != 'schedule'
        run: npm run test:e2e

      # After validation so a rejected push cannot hide its results. A failed
      # build or push stops the job before it can mirror uncommitted data. The tag
      # skips GitHub Actions only; Cloudflare Pages still sees the push and
      # deploys the fresh data. Do NOT tag it to skip "ci": Cloudflare honors
      # that form too and the deploy would be silently skipped.
      - name: Commit synced data
        if: github.event_name != 'pull_request'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          # lastmod.json is restamped by the build step above; without it the
          # sitemap would re-announce every synced listing on the next deploy.
          git add src/data/scholarships.json src/data/research-programs.json src/data/lastmod.json
          git diff --staged --quiet || { git commit -m "auto-sync scholarships [skip actions]" && git push; }

      # Git is the published-data authority; the database mirrors its validated
      # snapshot and preserves drafts. Recheck main immediately before writing:
      # another publisher or CI trigger can advance it while this run validates.
      # Do not mirror that older checkout over a newer published revision.
      # Cloudflare deploys separately: until deployment succeeds, the public site
      # can still serve the previous snapshot. A DB sync is not proof of a live
      # deploy, and publisher acknowledgment checks the public manifest itself.
      - name: Mirror latest validated JSON
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Skipping database sync: main advanced beyond this validated checkout."
            exit 0
          fi
          npx tsx scripts/sync-db.ts

      # The script verifies this exact publication and sitemap, with at most
      # three readiness checks. Failed announcements remain optional and visible.
      - name: Announce changed URLs (IndexNow)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run indexnow
