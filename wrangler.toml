# Cloudflare Workers with static assets. The Astro adapter fills in `main` and
# the assets directory and binding at build time.
name = "scholarab"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

# The site's hostnames. The zone's proxied CNAMEs for www and the apex point at
# this Worker's workers.dev name (the Pages project was retired 2026-09-29), and
# these routes send every request on them to the Worker. They are routes, not
# Custom Domains, because a Custom Domain has to replace those DNS records,
# which needs DNS edit rights the deploy token does not have. The apex is
# redirected to www by a zone Redirect Rule before a Worker runs; its route
# only matters if that rule is removed.
# workers.dev stays on: the publication check and IndexNow read the
# deployment there, outside the zone firewall.
workers_dev = true
routes = [
  { pattern = "www.scholarab.ca/*", zone_name = "scholarab.ca" },
  { pattern = "scholarab.ca/*", zone_name = "scholarab.ca" },
]

[assets]
# Pages parity: a path with no file gets dist's 404.html with a 404 status,
# and only the on-demand routes (formerly _routes.json's include list) run the
# Worker at all.
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/admin", "/admin/*", "/_image"]

# Workers Logs stay off, as they were on Pages. The API routes log caught
# errors, and a drizzle error carries its query parameters, so a failed
# /api/alert write would store a subscriber's email in Cloudflare for days.
# Set here rather than in the dashboard, because a deploy applies this file;
# `wrangler tail` still shows live logs without keeping them.
[observability]
enabled = false
