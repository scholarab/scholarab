<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline | ScholarAB</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0a0a0f; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    body { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; color: #f1f5f9; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; max-width: 280px; margin: 0 auto 28px; }
    a { display: inline-block; padding: 10px 24px; border-radius: 999px; background: #22d3a5; color: #0a0a0f; font-size: 14px; font-weight: 600; text-decoration: none; }
    a:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Any pages you've visited recently should still be available.</p>
    <a href="/">Go to home</a>
  </div>
</body>
</html>
